[project]
name = "nete"
version = "0.1.0"
description = "Background music, generated and mixed on this machine"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Li" }]
dependencies = []

[project.urls]
Source = "https://github.com/d4nyll/nete"

[project.scripts]
nete = "nete.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nete"]
